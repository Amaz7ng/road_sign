<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Автопилот — Распознавание знаков</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            background: #f8f9fa;
        }

        .upload-area:hover {
            background: #edf2f7;
            border-color: #764ba2;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 10px;
        }

        #preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        }

        button:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f3f9;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 14px;
            color: #764ba2;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-text {
            font-size: 20px;
            color: #2d3748;
            font-weight: bold;
        }

        .loader {
            display: none;
            margin: 15px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Распознавание дорожных знаков</h1>
    <p class="subtitle">Загрузите фотографию знака, и наша свёрточная нейросеть определит его тип.</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📸</div>
        <div style="color: #4a5568; font-weight: 500;">Нажмите, чтобы выбрать фото</div>
        <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
        <img id="preview" alt="Превью знака">
    </div>

    <button id="submitBtn" onclick="uploadAndPredict()" disabled>Запустить ИИ-анализ</button>
    
    <div class="loader" id="loader"></div>

    <div class="result-box" id="resultBox">
        <div class="result-title">Результат распознавания:</div>
        <div class="result-text" id="resultText">Ограничение скорости 30 км/ч</div>
    </div>
</div>

<script>
    // Функция для показа выбранной картинки на экране
    function previewImage(event) {
        const reader = new FileReader();
        const image = document.getElementById('preview');
        
        reader.onload = function() {
            image.src = reader.result;
            image.style.display = 'block';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('resultBox').style.display = 'none';
        }
        
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    // Главная функция отправки запроса на FastAPI бэкенд
    async function uploadAndPredict() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) return;

        // Включаем крутилку загрузки и выключаем кнопку
        document.getElementById('loader').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('resultBox').style.display = 'none';

        // Собираем данные формы (multipart/form-data) — точно так же, как делал Swagger
        const formData = new FormData();
        formData.append('file', file);

        try {
            // Делаем асинхронный HTTP POST запрос к твоему локальному серверу FastAPI
            const response = await fetch('https://road-sign-api.onrender.com/predict', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // Если бэкенд вернул успех, выводим текст знака на экран
            if (data.status === 'success') {
                document.getElementById('resultText').innerText = data.result;
                document.getElementById('resultBox').style.display = 'block';
            } else {
                alert('Ошибка нейросети: ' + data.message);
            }
        } catch (error) {
            console.error(error);
            alert('Не удалось достучаться до сервера FastAPI. Убедись, что uvicorn запущен!');
        } finally {
            // Выключаем крутилку обратно
            document.getElementById('loader').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
        }
    }
</script>
